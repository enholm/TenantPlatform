<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TenantPlatform report browser harness</title>
    <link rel="stylesheet" href="/bootstrap.css">
    <link rel="stylesheet" href="/app.css">
    <link rel="stylesheet" href="/report-chart.css">
    <link rel="stylesheet" href="/report-grid.css">
    <link rel="stylesheet" href="/report-palette.css">
    <link rel="stylesheet" href="/report-tree-chart.css">
    <style>
        body { padding: 1rem; }
        .harness-charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
        .harness-card { border: 1px solid var(--bs-border-color); border-radius: .5rem; padding: 1rem; min-width: 0; }
        .report-chart { height: 260px; min-height: 260px; }
        #hidden-chart { display: none; width: 520px; height: 260px; }
        #tree-chart { width: 100%; height: 360px; }
        #scroll-host { max-height: 520px; overflow: auto; border: 1px solid var(--bs-border-color); padding: .5rem; }
        #edit-grid, #view-grid { width: 100%; min-height: 16rem; }
        .grid-card { height: 100%; border: 1px solid var(--bs-border-color); background: var(--bs-body-bg); padding: 2.75rem .75rem; overflow: auto; }
        .chart-surface { height: 3rem; background: var(--bs-tertiary-bg); }
        .scroll-spacer { height: 700px; }
        #results li.pass { color: var(--bs-success-text-emphasis); }
        #results li.fail { color: var(--bs-danger-text-emphasis); font-weight: 700; }
        @media (max-width: 767.98px) { .harness-charts { grid-template-columns: 1fr; } }
    </style>
</head>
<body data-test-status="running">
    <h1>Report browser harness</h1>
    <p id="environment"></p>
    <ol id="results" aria-live="polite"></ol>

    <section class="harness-charts" aria-label="Charts">
        <article class="harness-card"><h2>Bar</h2><div id="bar-chart" class="report-chart"></div></article>
        <article class="harness-card"><h2>Line</h2><div id="line-chart" class="report-chart"></div></article>
        <article class="harness-card"><h2>Donut</h2><div id="donut-chart" class="report-chart"></div></article>
        <article class="harness-card"><h2>Empty and invalid</h2><p id="empty-result">No data</p><p id="invalid-donut">Invalid donut rejected</p></article>
    </section>
    <div id="hidden-chart" class="report-chart"></div>
    <section class="harness-card mt-4"><h2>Relationship tree</h2><div id="tree-chart" class="report-tree-chart"></div></section>

    <section class="mt-4" aria-label="Grid">
        <h2>Editable grid</h2>
        <div id="scroll-host" tabindex="0">
            <div id="edit-grid" class="report-layout-grid report-layout-grid-editable"></div>
            <div class="scroll-spacer"></div>
        </div>
        <p id="layout-status" aria-live="polite"></p>
        <h2>Read-only grid</h2>
        <div id="view-grid" class="report-layout-grid"></div>
    </section>

    <aside id="layout-palette" class="report-layout-palette" aria-label="Layout tools">
        <div class="report-layout-palette-header">
            <button type="button" class="report-palette-drag-handle" aria-label="Move layout tools">⠿</button>
            <strong>Layout tools</strong>
            <button type="button" id="palette-reset" class="btn btn-link btn-sm report-palette-reset">Reset position</button>
        </div>
        <p id="palette-selection" tabindex="-1">Selected card: 2</p>
        <div class="report-palette-section">
            <div class="report-palette-card-actions">
                <div class="d-flex gap-1">
                    <button type="button" id="palette-edit" class="btn btn-outline-primary btn-sm">Edit</button>
                    <button type="button" id="palette-duplicate" class="btn btn-outline-secondary btn-sm">Duplicate</button>
                </div>
                <button type="button" id="palette-delete" class="btn btn-outline-danger btn-sm report-palette-delete">Delete</button>
            </div>
            <select id="palette-target" class="form-select form-select-sm">
                <option value="">Choose</option>
                <option value="allowed-target">Allowed target</option>
            </select>
        </div>
        <div class="report-palette-section">
            <button type="button" id="palette-action" class="btn btn-outline-secondary btn-sm">Move</button>
            <button type="button" id="palette-resize" class="btn btn-outline-secondary btn-sm">Wider</button>
        </div>
    </aside>

    <script type="module" src="/browser-harness.js"></script>
</body>
</html>
